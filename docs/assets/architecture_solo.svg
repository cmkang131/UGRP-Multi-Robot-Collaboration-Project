<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 776" width="1160" height="776" role="img" aria-label="Solo 제어 구조: 자기 카메라 화면이 색 구분을 거쳐 상자 관측과 ACT 로 들어간다. 과제는 관측 목록의 몇 번째 상자인지와 목적지 바닥 색만 준다. 본 문과 구역은 장소 기억에 적어 두고 옮길 때 쓴다. 단계는 위에서 아래로 둘러보기, 접근 제어기, 정면 맞추기, ACT, 집기 끝 판정, 들었는지 확인, 든 채 옮기기, 내려놓기 순서로 진행하고. 옮길 때 자기 위치는 천장 카메라 측정값을 쓰고 지금 단계의 명령이 로봇으로 나간다. 나간 명령은 기록되어 상자 관측, ACT, 집기 끝 판정으로 되돌아간다." font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#111"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1.2 L9 5 L1 8.8" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1160" height="776" fill="#fff"/>

  <g fill="none" stroke="#111" stroke-width="1.15">
    <!-- task index -> box observations -->
    <path d="M212 148 H448" marker-end="url(#h)"/>
    <!-- camera -> colour classes -->
    <path d="M212 325 H253" marker-end="url(#h)"/>
    <rect x="255" y="300" width="140" height="50" rx="2" fill="#fff"/>
    <!-- colour classes -> box observations, -> ACT -->
    <path d="M325 300 V180 H448" marker-end="url(#h)"/>
    <path d="M395 325 H698" marker-end="url(#h)"/>
    <!-- box observations -->
    <rect x="450" y="120" width="170" height="80" rx="2" fill="#fff"/>
    <path d="M620 160 H698" marker-end="url(#h)"/>

    <!-- stages container -->
    <rect x="680" y="44" width="265" height="674" rx="2"/>

    <!-- 0 survey, 1 approach, 2 face alignment -->
    <rect x="700" y="72" width="225" height="48" rx="2" fill="#fff"/>
    <rect x="700" y="148" width="225" height="48" rx="2" fill="#fff"/>
    <rect x="700" y="224" width="225" height="48" rx="2" fill="#fff"/>
    <!-- 3 ACT -->
    <rect x="700" y="300" width="225" height="128" rx="2" fill="#efefef"/>
    <rect x="808" y="310" width="105" height="28" rx="2" fill="#fff"/>
    <rect x="808" y="348" width="105" height="28" rx="2" fill="#fff"/>
    <rect x="808" y="386" width="105" height="28" rx="2" fill="#fff"/>
    <path d="M860 386 V377" marker-end="url(#h)"/>
    <path d="M860 348 V339" marker-end="url(#h)"/>
    <!-- grasp-end test -->
    <rect x="700" y="456" width="225" height="42" rx="2" fill="#fff"/>
    <!-- 4 carry -->
    <rect x="700" y="526" width="225" height="48" rx="2" fill="#fff"/>
    <!-- 5 release -->
    <rect x="700" y="602" width="225" height="48" rx="2" fill="#fff"/>
    <!-- place memory -->
    <rect x="450" y="510" width="170" height="80" rx="2" fill="#fff"/>
    <path d="M325 350 V530 H448" marker-end="url(#h)"/>
    <path d="M212 566 H448" marker-end="url(#h)"/>
    <path d="M620 540 H698" marker-end="url(#h)"/>

    <!-- output to robot -->
    <path d="M945 345 H1038" marker-end="url(#h)"/>
    <rect x="1040" y="317" width="76" height="56" rx="2" fill="#fff"/>
  </g>

  <!-- stage order (dotted, open head) -->
  <g fill="none" stroke="#111" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="0.1 4.2">
    <path d="M812 121 V145" marker-end="url(#o)"/>
    <path d="M812 197 V221" marker-end="url(#o)"/>
    <path d="M812 273 V297" marker-end="url(#o)"/>
    <path d="M812 429 V453" marker-end="url(#o)"/>
    <path d="M812 499 V523" marker-end="url(#o)"/>
    <path d="M812 575 V599" marker-end="url(#o)"/>
  </g>

  <!-- feedback: record of issued commands (dashed) -->
  <g fill="none" stroke="#111" stroke-width="1.15" stroke-dasharray="7 4">
    <path d="M990 345 V26 H535 V118" marker-end="url(#h)"/>
    <path d="M990 345 V740 H650 V362 H698" marker-end="url(#h)"/>
    <path d="M650 477 H698" marker-end="url(#h)"/>
    <path d="M650 562 H698" marker-end="url(#h)"/>
  </g>
  <circle cx="990" cy="345" r="2.6" fill="#111"/>
  <circle cx="650" cy="477" r="2.6" fill="#111"/>
  <circle cx="650" cy="562" r="2.6" fill="#111"/>

  <!-- input labels -->
  <g font-size="15" fill="#111" text-anchor="end">
    <text x="204" y="145">계획기가 고른 번호</text>
    <text x="204" y="322">자기 카메라</text>
    <text x="204" y="563">계획기가 고른 목적지</text>
    <text x="204" y="612" fill="#1f5fbf">천장 카메라</text>
  </g>
  <g font-size="11.5" fill="#555" text-anchor="end">
    <text x="204" y="163">관측 목록의 몇 번째 상자</text>
    <text x="204" y="340">RGB 640×480</text>
    <text x="204" y="581">벽의 번호 표식</text>
    <text x="204" y="628" fill="#1f5fbf">자기 위치 · 방향, 다른 로봇 위치</text>
  </g>

  <!-- block names -->
  <g font-size="15" font-weight="500" fill="#111" text-anchor="middle">
    <text x="325" y="330">색 구분</text>
    <text x="535" y="147">상자 관측</text>
    <text x="820" y="92">둘러보기</text>
    <text x="820" y="168">접근 제어기</text>
    <text x="820" y="244">정면 맞추기</text>
    <text x="820" y="482">집기 끝 판정</text>
    <text x="820" y="546">든 채 옮기기</text>
    <text x="820" y="622">내려놓기</text>
    <text x="535" y="537">장소 기억</text>
    <text x="1078" y="350">로봇</text>
  </g>
  <text x="736" y="330" font-size="17" font-weight="700" fill="#111">ACT</text>
  <g font-size="11.5" fill="#555">
    <text x="736" y="350">집기 · 들기</text>
    <text x="736" y="366">학습 모델</text>
  </g>
  <g font-size="11.5" fill="#111" text-anchor="middle">
    <text x="860" y="328">디코더</text>
    <text x="860" y="366">인코더</text>
    <text x="860" y="404">ResNet-18</text>
  </g>
  <g font-size="11.5" fill="#555" text-anchor="middle">
    <text x="535" y="166">방위 · 거리 · 면의 기울기</text>
    <text x="535" y="183">본 상자를 목록으로</text>
    <text x="820" y="109">카메라를 돌려 상자를 찾음</text>
    <text x="820" y="185">지정 상자 0.2 m 앞까지</text>
    <text x="820" y="261">넓은 면 정면으로 · 안 보이면 복구</text>
    <text x="820" y="563">문을 지나 목적지 표식 앞으로</text>
    <text x="820" y="639">정해진 순서 재생</text>
    <text x="535" y="556">문 · 표식 · 상자의 대략 위치</text>
    <text x="535" y="573">본 것을 적어 둠</text>
    <text x="1078" y="365">시뮬 · 실물</text>
    <text x="1078" y="393">바퀴 4 · 서보 5</text>
    <text x="1078" y="409">0.1초마다</text>
  </g>

  <!-- stage numbers and container title -->
  <g font-size="12.5" font-weight="700" fill="#111">
    <text x="712" y="92">0</text>
    <text x="712" y="168">1</text>
    <text x="712" y="244">2</text>
    <text x="712" y="330">3</text>
    <text x="712" y="546">4</text>
    <text x="712" y="622">5</text>
  </g>
  <text x="692" y="63" font-size="12.5" font-weight="700" fill="#111">단계 <tspan font-weight="400" fill="#555">위에서 아래로 진행</tspan></text>

  <!-- what flows -->
  <g font-size="11.5" fill="#555">
    <text x="546" y="318" text-anchor="middle">벽 · 상자 · 바닥으로 나눈 화면, 최근 4장</text>
    <text x="333" y="245">상자 덩어리</text>
    <text x="822" y="137">관측 목록</text>
    <text x="822" y="213">도착</text>
    <text x="822" y="289">정렬됨</text>
    <text x="822" y="517">집기 끝</text>
    <text x="822" y="593">표식 앞 도착</text>
    <text x="760" y="18" text-anchor="middle">자기 명령 기록</text>
    <text x="820" y="760" text-anchor="middle">자기 명령 기록</text>
  </g>

  <!-- line legend -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M40 648 H92" marker-end="url(#h)"/>
    <path d="M40 672 H92" stroke-dasharray="7 4" marker-end="url(#h)"/>
    <path d="M40 696 H91" stroke-dasharray="0.1 4.2" stroke-width="1.9" stroke-linecap="round" marker-end="url(#o)"/>
  </g>
  <g font-size="11.5" fill="#555">
    <text x="102" y="652">신호 흐름</text>
    <text x="102" y="676">되먹임 (자기 명령 기록)</text>
    <text x="102" y="700">다음 단계로 넘어감</text>
  </g>
  <g fill="none" stroke="#1f5fbf" stroke-width="1.6">
    <path d="M212 617 H676 V556 H698"/>
    <path d="M690 556 L698 556" />
  </g>
  <path d="M698 556 l-8 -4 v8 z" fill="#1f5fbf"/>
  <text x="440" y="611" font-size="11" fill="#1f5fbf" text-anchor="middle">옮길 때 쓴다 (LLM 에는 가지 않는다)</text>
</svg>
