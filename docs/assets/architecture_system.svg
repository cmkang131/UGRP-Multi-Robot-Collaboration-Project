<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1010" width="1180" height="1010" role="img" aria-label="전체 구조: 팀 구조에 따라 로봇끼리 메시지가 오간다. 로봇마다 LLM 계획기가 자기가 본 상자, 자기 주문, 받은 메시지, 진행 상황, 그리고 자기 위치를 방 수준으로만 받아 메시지 초안을 쓰고 행동 목록에서 하나를 고른다. 고를 수 있는 것은 메시지 보내기, 집을 상자, 목적지 표식, 문을 지금 지날지 기다릴지다. 고른 행동은 실행층이 받는다. 상자 찾기와 다가가기, 정면 맞추기는 코드, 집기와 들기는 학습 모델 ACT, 들었는지 확인과 옮기기, 내려놓기, 충돌 직전 정지는 코드가 한다. 천장 카메라는 모든 로봇의 위치와 방향을 재서 실행층에만 준다. LLM 에는 자기 방 이름만 간다. 집기 실패와 문 통과 같은 결과는 계획기에 보고된다." font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#111"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#1f5fbf"/>
    </marker>
  </defs>
  <rect width="1180" height="1010" fill="#fff"/>

  <!-- ===== team structure band ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <rect x="30" y="24" width="1120" height="76" rx="2"/>
    <rect x="300" y="40" width="250" height="44" rx="2" fill="#fff"/>
    <rect x="570" y="40" width="250" height="44" rx="2" fill="#fff"/>
    <rect x="840" y="40" width="290" height="44" rx="2" fill="#fff"/>
  </g>
  <text x="46" y="57" font-size="15" font-weight="500" fill="#111">팀 구조</text>
  <text x="46" y="76" font-size="11.5" fill="#555">메시지가 오가는 방식만 바꾼다</text>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="425" y="59">T0 통신 없음</text>
    <text x="695" y="59">T1 모두 동등</text>
    <text x="985" y="59">T2 팀장 있음</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="425" y="76">자기 관측만으로 계획</text>
    <text x="695" y="76">서로 자유롭게 주고받음</text>
    <text x="985" y="76">보고를 받고 지시를 냄 (혼합 구조는 부록)</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M985 102 V148" marker-start="url(#h)" marker-end="url(#h)"/>
  </g>
  <text x="977" y="130" font-size="11.5" fill="#555" text-anchor="end">다른 로봇과 주고받는 메시지</text>

  <!-- ===== planner inputs ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <rect x="30" y="150" width="230" height="30" rx="2" fill="#fff"/>
    <rect x="30" y="188" width="230" height="30" rx="2" fill="#fff"/>
    <rect x="30" y="226" width="230" height="30" rx="2" fill="#fff"/>
    <rect x="30" y="264" width="230" height="30" rx="2" fill="#fff"/>
    <path d="M260 165 H288" marker-end="url(#h)"/>
    <path d="M260 203 H288" marker-end="url(#h)"/>
    <path d="M260 241 H288" marker-end="url(#h)"/>
    <path d="M260 279 H288" marker-end="url(#h)"/>
  </g>
  <rect x="30" y="302" width="230" height="30" rx="2" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/>
  <path d="M260 314 H288" fill="none" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#b)"/>
  <g font-size="12.5" fill="#111" text-anchor="middle">
    <text x="145" y="170">자기 카메라로 본 상자</text>
    <text x="145" y="208">과제가 준 자기 주문 (일부만)</text>
    <text x="145" y="246">받은 메시지</text>
    <text x="145" y="284">진행 상황 (집기 실패, 문 통과 등)</text>
  </g>
  <text x="145" y="322" font-size="12.5" fill="#1f5fbf" text-anchor="middle">자기 위치: 방 이름만</text>

  <!-- ===== planner ===== -->
  <g fill="none" stroke="#111">
    <rect x="290" y="150" width="860" height="182" rx="2" stroke-width="2.4"/>
    <rect x="310" y="208" width="245" height="72" rx="2" stroke-width="2.4" fill="#fff"/>
    <rect x="598" y="208" width="245" height="72" rx="2" stroke-width="1.15" fill="#fff"/>
    <rect x="886" y="208" width="245" height="72" rx="2" stroke-width="2.4" fill="#fff"/>
    <path d="M555 244 H596" stroke-width="1.15" marker-end="url(#h)"/>
    <path d="M843 244 H884" stroke-width="1.15" marker-end="url(#h)"/>
  </g>
  <text x="310" y="180" font-size="15" font-weight="500" fill="#111">LLM 계획기</text>
  <text x="402" y="180" font-size="11.5" fill="#555">로봇마다 하나. 결정할 때가 되면 실행층이 묻는다</text>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="432" y="239">1 메시지 초안 쓰기</text>
    <text x="720" y="239">2 가능한 행동 목록</text>
    <text x="1008" y="239">3 목록에서 하나 고르기</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="432" y="259">LLM. 보낼지는 3에서 정한다</text>
    <text x="720" y="259">코드. 지금 할 수 있는 것만</text>
    <text x="1008" y="259">LLM</text>
  </g>
  <text x="310" y="306" font-size="11.5" fill="#555">다른 로봇의 위치와 주문은 받지 않는다. 메시지로만 안다.</text>

  <!-- ===== choices ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M1008 332 V356"/>
    <path d="M140 356 H1040"/>
    <path d="M140 356 V376" marker-end="url(#h)"/>
    <path d="M440 356 V376" marker-end="url(#h)"/>
    <path d="M740 356 V376" marker-end="url(#h)"/>
    <path d="M1040 356 V376" marker-end="url(#h)"/>
    <rect x="40" y="378" width="200" height="48" rx="2" fill="#fff"/>
    <rect x="340" y="378" width="200" height="48" rx="2" fill="#fff"/>
    <rect x="640" y="378" width="200" height="48" rx="2" fill="#fff"/>
    <rect x="940" y="378" width="200" height="48" rx="2" fill="#fff"/>
  </g>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="140" y="400">메시지 보내기</text>
    <text x="440" y="400">집을 상자</text>
    <text x="740" y="400">목적지 표식</text>
    <text x="1040" y="400">문: 지금 / 기다림</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="140" y="417">팀 구조가 정한 상대에게</text>
    <text x="440" y="417">자기 목록의 몇 번째</text>
    <text x="740" y="417">벽의 번호 표식 11·12·13</text>
    <text x="1040" y="417">한 번에 한 대만 지난다</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M140 426 V448 H22 V62 H28" marker-end="url(#h)"/>
    <path d="M440 426 V470" marker-end="url(#h)"/>
    <path d="M740 426 V470" marker-end="url(#h)"/>
    <path d="M1040 426 V470" marker-end="url(#h)"/>
  </g>

  <!-- ===== execution layer ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <rect x="300" y="472" width="850" height="330" rx="2"/>
    <rect x="320" y="508" width="240" height="44" rx="2" fill="#fff"/>
    <rect x="320" y="568" width="240" height="44" rx="2" fill="#e9e9e9"/>
    <rect x="320" y="628" width="240" height="44" rx="2" fill="#fff"/>
    <path d="M440 552 V566" marker-end="url(#h)"/>
    <path d="M440 612 V626" marker-end="url(#h)"/>
    <rect x="620" y="508" width="240" height="44" rx="2" fill="#fff"/>
    <rect x="620" y="568" width="240" height="44" rx="2" fill="#fff"/>
    <rect x="620" y="628" width="240" height="44" rx="2" fill="#fff"/>
    <path d="M740 552 V566" marker-end="url(#h)"/>
    <path d="M740 612 V626" marker-end="url(#h)"/>
    <path d="M560 650 H590 V530 H618" marker-end="url(#h)"/>
    <rect x="920" y="508" width="210" height="104" rx="2" fill="#fff"/>
    <rect x="320" y="700" width="810" height="44" rx="2" fill="#fff"/>
  </g>
  <text x="318" y="494" font-size="13" font-weight="500" fill="#111">실행층 <tspan font-weight="400" fill="#555">로봇 한 대마다. 고른 행동을 바퀴와 팔 명령으로 바꾼다</tspan></text>
  <g font-size="12.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="440" y="528">상자 찾기, 다가가기, 정면 맞추기</text>
    <text x="440" y="588">집기, 들기</text>
    <text x="440" y="648">들었는지 확인</text>
    <text x="740" y="528">문 앞으로 가서 지나가기</text>
    <text x="740" y="588">목적지 표식을 찾아 그 앞으로</text>
    <text x="740" y="648">내려놓기</text>
    <text x="1025" y="540">문 앞에서 기다리기</text>
    <text x="725" y="720">충돌 직전 정지: 앞에 다른 로봇이 있으면 멈춘다</text>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="440" y="544">코드, 자기 카메라</text>
    <text x="440" y="604">학습 모델 (ACT), 자기 카메라</text>
    <text x="440" y="664">코드, 자기 카메라. 빈손이면 다시</text>
    <text x="740" y="544">코드</text>
    <text x="740" y="604">코드, 자기 카메라로 표식 읽기</text>
    <text x="740" y="664">코드</text>
    <text x="1025" y="558">계획기가 "지금"이라고</text>
    <text x="1025" y="574">할 때까지 상자를 든 채</text>
    <text x="725" y="736">코드. 안전장치일 뿐 순서는 정하지 않는다</text>
  </g>
  <text x="318" y="788" font-size="11.5" fill="#555">상자를 찾고 집는 것, 표식을 읽는 것은 모두 자기 카메라로 한다. 지도와 상자의 실제 위치는 쓰지 않는다.</text>

  <!-- results reported up to the planner -->
  <g fill="none" stroke="#111" stroke-width="1.15" stroke-dasharray="6 4">
    <path d="M300 660 H276 V322 H288" marker-end="url(#h)"/>
  </g>
  <text x="270" y="520" font-size="11" fill="#555" text-anchor="middle" transform="rotate(-90 270 520)">결과 보고 → 진행 상황</text>

  <!-- ===== robot and sensors ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M725 802 V846" marker-end="url(#h)"/>
    <rect x="620" y="848" width="210" height="56" rx="2" fill="#fff"/>
    <rect x="350" y="848" width="210" height="56" rx="2" fill="#fff"/>
    <path d="M620 876 H562" marker-end="url(#h)"/>
    <path d="M455 848 V804" marker-end="url(#h)"/>
  </g>
  <text x="733" y="828" font-size="11.5" fill="#555">명령, 0.1초마다</text>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="725" y="872">로봇</text>
    <text x="455" y="872">자기 카메라 (팔 끝)</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="725" y="891">바퀴 4, 서보 5</text>
    <text x="455" y="891">상자, 표식, 든 상자</text>
  </g>

  <!-- ceiling cameras: to the execution layer only -->
  <rect x="900" y="848" width="250" height="56" rx="2" fill="#fff" stroke="#1f5fbf" stroke-width="1.6"/>
  <text x="1025" y="872" font-size="13.5" font-weight="500" fill="#1f5fbf" text-anchor="middle">천장 카메라 (1대, 경기장 위)</text>
  <text x="1025" y="891" font-size="11" fill="#1f5fbf" text-anchor="middle">로봇 윗면 번호 표식 → 모든 로봇의 위치·방향</text>
  <g fill="none" stroke="#1f5fbf" stroke-width="1.6">
    <path d="M1025 848 V804" marker-end="url(#b)"/>
    <path d="M1150 876 H1168 V138 H10 V317 H28" stroke-dasharray="2 4" marker-end="url(#b)"/>
  </g>
  <text x="1033" y="828" font-size="11" fill="#1f5fbf">모든 로봇 위치 → 실행층만</text>
  <text x="300" y="133" font-size="11" fill="#1f5fbf">천장 카메라 측정값 가운데 LLM 에 가는 것은 자기 방 이름뿐</text>

  <!-- ===== legend ===== -->
  <g fill="none">
    <rect x="30" y="940" width="30" height="20" rx="2" stroke="#111" stroke-width="2.4"/>
    <rect x="190" y="940" width="30" height="20" rx="2" stroke="#111" stroke-width="1.15" fill="#e9e9e9"/>
    <rect x="410" y="940" width="30" height="20" rx="2" stroke="#111" stroke-width="1.15"/>
    <path d="M560 950 H600" stroke="#1f5fbf" stroke-width="1.6" marker-end="url(#b)"/>
    <path d="M820 950 H860" stroke="#111" stroke-width="1.15" stroke-dasharray="6 4" marker-end="url(#h)"/>
  </g>
  <g font-size="12" fill="#111">
    <text x="68" y="955">LLM 이 하는 일</text>
    <text x="228" y="955">학습 모델(ACT)이 하는 일</text>
    <text x="448" y="955">코드가 하는 일</text>
    <text x="608" y="955">천장 카메라 측정값</text>
    <text x="868" y="955">실행 결과 보고</text>
  </g>
</svg>
