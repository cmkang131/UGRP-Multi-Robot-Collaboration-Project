<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" role="img" aria-label="전체 구조: 팀 구조에 따라 로봇끼리 메시지가 오간다. 로봇마다 LLM 계획기가 자기가 본 것, 장소 기억, 받은 메시지, 진행 상황을 받아 메시지 초안을 쓰고, 코드가 만든 행동 목록에서 하나를 고른다. 고를 수 있는 행동은 메시지 보내기, 상자 집으러 가기, 든 상자를 구역으로 옮기기, 다른 방으로 가기, 지금 방 탐색이다. 집기와 들기만 학습 모델 ACT 가 하고, 찾기, 다가가기, 든 채 이동, 문 통과, 내려놓기는 코드가 한다. 계획기의 선택을 실제 동작으로 넘기는 연결은 아직 잇지 않았다." font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1180" height="900" fill="#fff"/>

  <!-- ===== team structure band ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <rect x="30" y="24" width="1120" height="76" rx="2"/>
    <rect x="290" y="40" width="200" height="44" rx="2" fill="#fff"/>
    <rect x="505" y="40" width="200" height="44" rx="2" fill="#fff"/>
    <rect x="720" y="40" width="200" height="44" rx="2" fill="#fff"/>
    <rect x="935" y="40" width="200" height="44" rx="2" fill="#fff"/>
  </g>
  <g font-size="15" font-weight="500" fill="#111">
    <text x="46" y="57">팀 구조</text>
  </g>
  <g font-size="11.5" fill="#555">
    <text x="46" y="76">메시지가 오가는 방식만 바꾼다</text>
  </g>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="390" y="59">T0 통신 없음</text>
    <text x="605" y="59">T1 모두 동등</text>
    <text x="820" y="59">T2 팀장 있음</text>
    <text x="1035" y="59">T3 혼합</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="390" y="76">자기 관측만으로 계획</text>
    <text x="605" y="76">서로 자유롭게 주고받음</text>
    <text x="820" y="76">보고를 받고 지시를 냄</text>
    <text x="1035" y="76">중앙 초안, 맡은 로봇이 검토</text>
  </g>

  <!-- messages between team band and planner -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M1035 102 V148" marker-start="url(#h)" marker-end="url(#h)"/>
  </g>
  <text x="1027" y="130" font-size="11.5" fill="#555" text-anchor="end">다른 로봇과 주고받는 메시지</text>

  <!-- ===== planner inputs ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <rect x="30" y="150" width="210" height="30" rx="2" fill="#fff"/>
    <rect x="30" y="190" width="210" height="30" rx="2" fill="#fff"/>
    <rect x="30" y="230" width="210" height="30" rx="2" fill="#fff"/>
    <rect x="30" y="270" width="210" height="30" rx="2" fill="#fff"/>
    <path d="M240 165 H278" marker-end="url(#h)"/>
    <path d="M240 205 H278" marker-end="url(#h)"/>
    <path d="M240 245 H278" marker-end="url(#h)"/>
    <path d="M240 285 H278" marker-end="url(#h)"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="135" y="170">자기가 본 것 (관측 목록)</text>
    <text x="135" y="210">장소 기억 (문, 구역, 상자)</text>
    <text x="135" y="250">받은 메시지</text>
    <text x="135" y="290">진행 상황과 이전 행동</text>
  </g>

  <!-- ===== planner ===== -->
  <g fill="none" stroke="#111">
    <rect x="280" y="150" width="870" height="150" rx="2" stroke-width="2.4"/>
    <rect x="300" y="205" width="240" height="72" rx="2" stroke-width="2.4" fill="#fff"/>
    <rect x="585" y="205" width="240" height="72" rx="2" stroke-width="1.15" fill="#fff"/>
    <rect x="870" y="205" width="260" height="72" rx="2" stroke-width="2.4" fill="#fff"/>
    <path d="M540 241 H583" stroke-width="1.15" marker-end="url(#h)"/>
    <path d="M825 241 H868" stroke-width="1.15" marker-end="url(#h)"/>
  </g>
  <g font-size="15" font-weight="500" fill="#111">
    <text x="300" y="180">LLM 계획기</text>
  </g>
  <g font-size="11.5" fill="#555">
    <text x="392" y="180">로봇마다 하나. 한 행동이 끝날 때마다 다음 행동을 다시 고른다</text>
  </g>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="420" y="236">1 메시지 초안 쓰기</text>
    <text x="705" y="236">2 가능한 행동 목록 만들기</text>
    <text x="1000" y="236">3 목록에서 하나 고르기</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="420" y="256">LLM. 보낼지는 3에서 정한다</text>
    <text x="705" y="256">코드. 지금 할 수 있는 것만 넣는다</text>
    <text x="1000" y="256">LLM. 이유를 쓰고 하나를 답한다</text>
  </g>

  <!-- ===== choice menu ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M1000 300 V326"/>
    <path d="M134 326 H1046"/>
    <path d="M134 326 V348" marker-end="url(#h)"/>
    <path d="M362 326 V348" marker-end="url(#h)"/>
    <path d="M590 326 V348" marker-end="url(#h)"/>
    <path d="M818 326 V348" marker-end="url(#h)"/>
    <path d="M1046 326 V348" marker-end="url(#h)"/>
    <rect x="30" y="350" width="208" height="50" rx="2" fill="#fff"/>
    <rect x="258" y="350" width="208" height="50" rx="2" fill="#fff"/>
    <rect x="486" y="350" width="208" height="50" rx="2" fill="#fff"/>
    <rect x="714" y="350" width="208" height="50" rx="2" fill="#fff"/>
    <rect x="942" y="350" width="208" height="50" rx="2" fill="#fff"/>
  </g>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="134" y="380">메시지 보내기</text>
    <text x="362" y="380">상자 집으러 가기</text>
    <text x="590" y="380">든 상자를 구역으로 옮기기</text>
    <text x="818" y="380">다른 방으로 가기</text>
    <text x="1046" y="380">지금 방 탐색</text>
  </g>

  <!-- message goes back up to the team (solid) -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M134 400 V452" marker-end="url(#h)"/>
    <rect x="30" y="454" width="208" height="58" rx="2" fill="#fff"/>
    <path d="M30 483 H14 V62 H28" marker-end="url(#h)"/>
  </g>
  <g font-size="13" fill="#111" text-anchor="middle">
    <text x="134" y="479">다른 로봇에게 전달</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="134" y="498">팀 구조가 정한 상대에게</text>
  </g>

  <!-- ===== not yet connected: choice -> physical execution (dashed) ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15" stroke-dasharray="7 4">
    <path d="M362 400 V468" marker-end="url(#h)"/>
    <path d="M590 400 V468" marker-end="url(#h)"/>
    <path d="M818 400 V468" marker-end="url(#h)"/>
    <path d="M1046 400 V468" marker-end="url(#h)"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="370" y="424">목록의 몇 번째 상자</text>
    <text x="598" y="424">바닥 색, 놓는 시점</text>
    <text x="826" y="424">어느 문</text>
  </g>

  <!-- ===== execution ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <rect x="248" y="444" width="912" height="246" rx="2"/>
    <!-- grasp column -->
    <rect x="258" y="470" width="208" height="52" rx="2" fill="#fff"/>
    <rect x="258" y="540" width="208" height="52" rx="2" fill="#e9e9e9"/>
    <rect x="258" y="610" width="208" height="46" rx="2" fill="#fff"/>
    <path d="M362 522 V538" marker-end="url(#h)"/>
    <path d="M362 592 V608" marker-end="url(#h)"/>
    <!-- carry column -->
    <rect x="486" y="470" width="208" height="52" rx="2" fill="#fff"/>
    <rect x="486" y="540" width="208" height="52" rx="2" fill="#fff"/>
    <rect x="486" y="610" width="208" height="46" rx="2" fill="#fff"/>
    <path d="M590 522 V538" marker-end="url(#h)"/>
    <path d="M590 592 V608" marker-end="url(#h)"/>
    <!-- go column -->
    <rect x="714" y="470" width="208" height="52" rx="2" fill="#fff"/>
    <!-- explore column -->
    <rect x="942" y="470" width="208" height="52" rx="2" fill="#fff"/>
  </g>
  <g font-size="11.5" fill="#555">
    <text x="722" y="560">실행: 로봇 한 대가 자기 카메라만 보고 한다.</text>
    <text x="722" y="578">집기와 들기만 학습 모델, 나머지는 코드.</text>
    <text x="722" y="606">지도, 벽 표식, 천장 카메라, 상자의 실제 위치는</text>
    <text x="722" y="624">쓰지 않는다.</text>
  </g>
  <g font-size="13" font-weight="500" fill="#111" text-anchor="middle">
    <text x="362" y="492">찾기, 다가가기, 정면 맞추기</text>
    <text x="362" y="562">집기, 들기</text>
    <text x="362" y="638">집기 끝 판정</text>
    <text x="590" y="492">문 찾기</text>
    <text x="590" y="562">문 지나 구역으로 이동</text>
    <text x="590" y="638">내려놓기</text>
    <text x="818" y="492">문을 찾아 지나가기</text>
    <text x="1046" y="492">둘러보고 열린 쪽으로 이동</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="362" y="510">코드</text>
    <text x="362" y="580">학습 모델 (ACT)</text>
    <text x="590" y="510">코드. 기억, 탐색, 들은 위치</text>
    <text x="590" y="580">코드. 주행 기록으로 자기 위치 추정</text>
    <text x="818" y="510">코드. 옮기기와 같은 이동</text>
    <text x="1046" y="510">코드. 본 것을 장소 기억에 적는다</text>
  </g>

  <!-- ===== robot and perception ===== -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M704 690 V738" marker-end="url(#h)"/>
    <rect x="600" y="740" width="208" height="56" rx="2" fill="#fff"/>
    <path d="M600 768 H560" marker-end="url(#h)"/>
    <rect x="350" y="740" width="208" height="56" rx="2" fill="#fff"/>
    <path d="M350 768 H310" marker-end="url(#h)"/>
    <rect x="100" y="740" width="208" height="56" rx="2" fill="#fff"/>
    <path d="M100 768 H22 V530 H4 V165 H28" marker-end="url(#h)"/>
    <path d="M4 205 H28" marker-end="url(#h)"/>
  </g>
  <circle cx="4" cy="205" r="2.6" fill="#111"/>
  <text x="712" y="718" font-size="11.5" fill="#555">명령, 0.1초마다</text>
  <g font-size="13.5" font-weight="500" fill="#111" text-anchor="middle">
    <text x="704" y="764">로봇</text>
    <text x="454" y="764">자기 카메라, 색 구분</text>
    <text x="204" y="764">상자 관측, 장소 기억 갱신</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="704" y="783">바퀴 4, 서보 5. 낸 명령을 기록</text>
    <text x="454" y="783">RGB 640×480</text>
    <text x="204" y="783">방위와 거리로 대략 위치만</text>
  </g>

  <!-- ===== legend ===== -->
  <g fill="none" stroke="#111">
    <rect x="30" y="838" width="30" height="20" rx="2" stroke-width="2.4"/>
    <rect x="200" y="838" width="30" height="20" rx="2" stroke-width="1.15" fill="#e9e9e9"/>
    <rect x="420" y="838" width="30" height="20" rx="2" stroke-width="1.15"/>
    <path d="M560 848 H600" stroke-width="1.15" stroke-dasharray="7 4" marker-end="url(#h)"/>
  </g>
  <g font-size="12" fill="#111">
    <text x="68" y="853">LLM 이 하는 일</text>
    <text x="238" y="853">학습 모델(ACT)이 하는 일</text>
    <text x="458" y="853">코드가 하는 일</text>
    <text x="608" y="853">아직 잇지 않음. 계획은 계획 전용 환경에서, 동작은 MuJoCo 에서 따로 확인했다</text>
  </g>
</svg>
