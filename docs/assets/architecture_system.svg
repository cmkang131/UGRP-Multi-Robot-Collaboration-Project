<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-label="전체 구조(2차 실험): 로봇 3대(상자 5개) 또는 6대(상자 10개)가 상자를 여러 번 나른다. 모든 로봇이 모든 주문과 순서 규칙을 안다. 팀 구조는 동등(누구나 누구에게나 말함)과 선출 팀장(모든 말이 팀장을 거치고 팀장 배정을 따름) 두 가지다. 로봇마다 LLM 하나가 결정마다 일하기 또는 말하기를 고르고, 말하면 시뮬 시간을 쓴다. 고른 행동은 실행층이 바꾼다: 집기와 들기는 ACT, 접근, 운반, 문 통과, 내려놓기는 코드. 자기 카메라는 계획층과 실행층에, 천장 카메라는 실행층에만 준다. 채점은 실행이 끝난 뒤 정답 좌표로 배달 비율, 완료 시간, 순서 위반을 낸다" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif">
  <title>전체 구조</title>
  <defs>
    <style>
      text { fill: #1a1a1a; font-size: 13px; }
      .tb { font-size: 14px; font-weight: 600; }
      .tm { font-size: 13.5px; font-weight: 600; }
      .ts { font-size: 12px; fill: #4b5563; }
      .bl { fill: #1f5fbf; }
      .cont { fill: #f1f2f4; stroke: #374151; stroke-width: 1.3; }
      .box { fill: #fff; stroke: #374151; stroke-width: 1.1; }
      .llm { fill: #fff; stroke: #1a1a1a; stroke-width: 2.4; }
      .act { fill: #dcdfe4; stroke: #374151; stroke-width: 1.1; }
      .cam { fill: #eaf1fb; stroke: #1f5fbf; stroke-width: 1.5; }
      .dash { fill: #fff; stroke: #6b7280; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .ln { fill: none; stroke: #1a1a1a; stroke-width: 1.2; }
      .lb { fill: none; stroke: #1f5fbf; stroke-width: 1.6; }
      .lg { fill: none; stroke: #6b7280; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .node { fill: #fff; stroke: #1a1a1a; stroke-width: 1.3; }
      .lead { fill: #fff; stroke: #1a1a1a; stroke-width: 2.4; }
      .edge { stroke: #1a1a1a; stroke-width: 1.2; }
    </style>
    <marker id="h" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#1a1a1a"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#1f5fbf"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="1079" height="559" rx="10" fill="#fafafa" stroke="#c4c7cc"/>

  <!-- ① conditions strip -->
  <rect class="cont" x="20" y="18" width="1040" height="150" rx="3"/>
  <text class="tb" x="36" y="42">① 실험 조건</text>
  <text class="ts" x="128" y="42">바꾸는 것은 팀 구조와 로봇 수뿐이다</text>

  <rect class="box" x="36" y="54" width="300" height="100" rx="2"/>
  <text class="tm" x="48" y="76">로봇 수</text>
  <text x="48" y="98">3대 · 상자 5개</text>
  <text x="48" y="118">6대 · 상자 10개</text>
  <text class="ts" x="48" y="140">상자가 로봇보다 많아 여러 번 나른다</text>

  <rect class="box" x="352" y="54" width="300" height="100" rx="2"/>
  <text class="tm" x="364" y="76">과제 (한 종류)</text>
  <text x="364" y="98">모든 로봇이 모든 주문과</text>
  <text x="364" y="118">순서 규칙을 안다</text>
  <text class="ts" x="364" y="140">상자는 자기 카메라로 본 것만 안다</text>

  <rect class="box" x="668" y="54" width="376" height="100" rx="2"/>
  <text class="tm" x="680" y="76">팀 구조</text>
  <!-- P -->
  <text x="684" y="100">P 동등</text>
  <line class="edge" x1="770" y1="96" x2="812" y2="96"/>
  <line class="edge" x1="770" y1="96" x2="791" y2="132"/>
  <line class="edge" x1="812" y1="96" x2="791" y2="132"/>
  <circle class="node" cx="770" cy="96" r="8"/><circle class="node" cx="812" cy="96" r="8"/><circle class="node" cx="791" cy="132" r="8"/>
  <!-- LE -->
  <text x="830" y="100">LE 선출 팀장</text>
  <line class="edge" x1="1004" y1="90" x2="984" y2="130"/>
  <line class="edge" x1="1004" y1="90" x2="1024" y2="130"/>
  <circle class="lead" cx="1004" cy="90" r="9"/><circle class="node" cx="984" cy="130" r="8"/><circle class="node" cx="1024" cy="130" r="8"/>
  <text class="ts" x="830" y="122">모든 말이 팀장을 거치고</text>
  <text class="ts" x="830" y="140">팀장 배정을 따른다</text>

  <line class="ln" x1="510" y1="168" x2="510" y2="206" marker-end="url(#h)"/>
  <text class="ts" x="518" y="192">주문 · 순서 규칙 · 팀 구조</text>

  <!-- sensors -->
  <rect class="box" x="20" y="210" width="210" height="96" rx="2"/>
  <text class="tm" x="32" y="232">④ 자기 카메라 (팔 끝)</text>
  <text x="32" y="254">상자 · 문 · 목적지 표식</text>
  <text class="ts" x="32" y="276">계획층: 본 상자 목록</text>
  <text class="ts" x="32" y="294">실행층: 방향과 거리</text>

  <rect class="cam" x="20" y="330" width="210" height="96" rx="2"/>
  <text class="tm bl" x="32" y="352">④ 천장 카메라</text>
  <text class="bl" x="32" y="374">모든 로봇의 위치 · 방향</text>
  <text class="bl" x="32" y="394">0.5초마다</text>
  <text class="ts bl" x="32" y="414">실행층만 쓴다</text>

  <!-- ②③ one robot -->
  <rect class="cont" x="270" y="210" width="500" height="330" rx="3"/>
  <text class="tb" x="286" y="234">로봇마다 (모든 로봇이 같다)</text>

  <rect class="llm" x="286" y="248" width="468" height="92" rx="2"/>
  <text class="tm" x="300" y="270">② 계획층 · LLM</text>
  <text x="300" y="294">결정마다 <tspan font-weight="600">일하기</tspan> 또는 <tspan font-weight="600">말하기</tspan> 중 하나를 고른다</text>
  <text class="ts" x="300" y="314">일하기: 집을 상자, 목적지, 문 지나기 · 기다리기, 내려놓기</text>
  <text class="ts" x="300" y="331">말하기: 그동안 몸은 서 있다 (시뮬 시간을 쓴다)</text>

  <line class="ln" x1="470" y1="340" x2="470" y2="372" marker-end="url(#h)"/>
  <text class="ts" x="478" y="362">행동</text>
  <line class="lg" x1="600" y1="372" x2="600" y2="340" marker-end="url(#g)"/>
  <text class="ts" x="608" y="362">진행 보고</text>

  <rect class="box" x="286" y="376" width="468" height="86" rx="2"/>
  <text class="tm" x="300" y="398">③ 실행층</text>
  <rect class="act" x="300" y="408" width="140" height="42" rx="2"/>
  <text x="312" y="426">집기 · 들기</text>
  <text class="ts" x="312" y="443">ACT 학습 모델</text>
  <rect class="box" x="452" y="408" width="288" height="42" rx="2"/>
  <text x="464" y="426">접근 · 운반 · 문 통과 · 내려놓기</text>
  <text class="ts" x="464" y="443">코드</text>

  <line class="ln" x1="520" y1="462" x2="520" y2="490" marker-end="url(#h)"/>
  <rect class="box" x="400" y="492" width="240" height="36" rx="2"/>
  <text x="414" y="515">로봇 · 바퀴 4, 서보 5</text>

  <!-- sensor arrows -->
  <path class="ln" d="M230 258 H286" marker-end="url(#h)"/>
  <path class="ln" d="M230 290 H258 V420 H286" marker-end="url(#h)"/>
  <path class="lb" d="M230 400 H246 V440 H286" marker-end="url(#b)"/>

  <!-- other robots -->
  <rect class="llm" x="810" y="210" width="250" height="120" rx="2"/>
  <text class="tm" x="824" y="232">다른 로봇의 계획층</text>
  <text x="824" y="256">P: 누구에게나, 또는 모두에게</text>
  <text x="824" y="278">LE: 팀원은 팀장에게만,</text>
  <text x="824" y="296">팀장은 팀원에게 전하고 배정</text>
  <text class="ts" x="824" y="318">받은 말은 다음 결정에 보인다</text>
  <line class="ln" x1="754" y1="282" x2="810" y2="282" marker-start="url(#h)" marker-end="url(#h)"/>
  <text class="ts" x="776" y="272">말</text>

  <!-- scoring -->
  <rect class="dash" x="810" y="376" width="250" height="152" rx="3"/>
  <text class="tm" x="824" y="398">⑤ 채점 (옆에서)</text>
  <text x="824" y="422">실행이 끝난 뒤 정답 좌표로</text>
  <text x="824" y="442">놓인 상자와 순서를 센다</text>
  <text class="ts" x="824" y="466">배달 비율 · 완료 시간 · 순서 위반</text>
  <text class="ts" x="824" y="490">정답은 어느 층에도 주지 않는다</text>
  <path class="lg" d="M770 470 H810" marker-end="url(#g)"/>
</svg>
