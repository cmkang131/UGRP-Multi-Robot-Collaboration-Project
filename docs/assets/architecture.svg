<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="Solo 제어 구조: 자기 카메라와 지정 상자의 기억이 색 구분과 상자 위치 추정을 거쳐 단계 상자로 들어간다. 단계는 위에서 아래로 접근 제어기, ACT, 집기 끝 판정, 내려놓기 순서로 진행하고 지금 단계의 명령이 로봇으로 나간다. 나간 명령은 기록되어 상자 위치 추정, ACT, 집기 끝 판정으로 되돌아간다." font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0.5 1.2 L10 5 L0.5 8.8 z" fill="#111"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 1.2 L9 5 L1 8.8" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1160" height="560" fill="#fff"/>

  <g fill="none" stroke="#111" stroke-width="1.15">
    <!-- memory -> estimator -->
    <path d="M212 90 H448" marker-end="url(#h)"/>
    <!-- camera -> colour classes -->
    <path d="M212 225 H253" marker-end="url(#h)"/>
    <rect x="255" y="200" width="140" height="50" rx="2" fill="#fff"/>
    <!-- colour classes -> estimator, -> ACT -->
    <path d="M325 200 V116 H448" marker-end="url(#h)"/>
    <path d="M395 225 H698" marker-end="url(#h)"/>
    <!-- estimator -->
    <rect x="450" y="70" width="170" height="66" rx="2" fill="#fff"/>
    <path d="M620 103 H698" marker-end="url(#h)"/>

    <!-- stages container -->
    <rect x="680" y="44" width="265" height="436" rx="2"/>

    <!-- 1 approach controller -->
    <rect x="700" y="74" width="225" height="58" rx="2" fill="#fff"/>
    <!-- 2 ACT -->
    <rect x="700" y="166" width="225" height="128" rx="2" fill="#efefef"/>
    <rect x="808" y="176" width="105" height="28" rx="2" fill="#fff"/>
    <rect x="808" y="214" width="105" height="28" rx="2" fill="#fff"/>
    <rect x="808" y="252" width="105" height="28" rx="2" fill="#fff"/>
    <path d="M860 252 V243" marker-end="url(#h)"/>
    <path d="M860 214 V205" marker-end="url(#h)"/>
    <!-- grasp-end test -->
    <rect x="700" y="328" width="225" height="42" rx="2" fill="#fff"/>
    <!-- 3 release -->
    <rect x="700" y="404" width="225" height="58" rx="2" fill="#fff"/>

    <!-- output to robot -->
    <path d="M945 265 H1038" marker-end="url(#h)"/>
    <rect x="1040" y="237" width="76" height="56" rx="2" fill="#fff"/>
  </g>

  <!-- stage order (dotted, open head) -->
  <g fill="none" stroke="#111" stroke-width="1.9" stroke-linecap="round" stroke-dasharray="0.1 4.2">
    <path d="M812 133 V163" marker-end="url(#o)"/>
    <path d="M812 295 V325" marker-end="url(#o)"/>
    <path d="M812 371 V401" marker-end="url(#o)"/>
  </g>

  <!-- feedback: record of issued commands (dashed) -->
  <g fill="none" stroke="#111" stroke-width="1.15" stroke-dasharray="7 4">
    <path d="M990 265 V26 H535 V68" marker-end="url(#h)"/>
    <path d="M990 265 V520 H650 V262 H698" marker-end="url(#h)"/>
    <path d="M650 349 H698" marker-end="url(#h)"/>
  </g>
  <circle cx="990" cy="265" r="2.6" fill="#111"/>
  <circle cx="650" cy="349" r="2.6" fill="#111"/>

  <!-- input labels -->
  <g font-size="15" fill="#111" text-anchor="end">
    <text x="204" y="87">지정 상자의 기억</text>
    <text x="204" y="222">자기 카메라</text>
  </g>
  <g font-size="11.5" fill="#555" text-anchor="end">
    <text x="204" y="105">방위 · 거리, 시작할 때 한 번</text>
    <text x="204" y="240">RGB 640×480</text>
  </g>

  <!-- block names -->
  <g font-size="15" font-weight="500" fill="#111" text-anchor="middle">
    <text x="325" y="230">색 구분</text>
    <text x="535" y="99">상자 위치 추정</text>
    <text x="820" y="108">접근 제어기</text>
    <text x="820" y="354">집기 끝 판정</text>
    <text x="820" y="438">내려놓기</text>
    <text x="1078" y="270">로봇</text>
  </g>
  <text x="736" y="196" font-size="17" font-weight="700" fill="#111">ACT</text>
  <g font-size="11.5" fill="#555">
    <text x="736" y="216">집기 · 들기</text>
    <text x="736" y="232">학습 모델</text>
  </g>
  <g font-size="11.5" fill="#111" text-anchor="middle">
    <text x="860" y="194">디코더</text>
    <text x="860" y="232">인코더</text>
    <text x="860" y="270">ResNet-18</text>
  </g>
  <g font-size="11.5" fill="#555" text-anchor="middle">
    <text x="535" y="119">보이면 화면, 안 보이면 기록</text>
    <text x="1078" y="285">시뮬 · 실물</text>
    <text x="1078" y="313">바퀴 4 · 서보 5</text>
    <text x="1078" y="329">0.1초마다</text>
  </g>

  <!-- stage numbers and container title -->
  <g font-size="12.5" font-weight="700" fill="#111">
    <text x="712" y="108">1</text>
    <text x="712" y="196">2</text>
    <text x="712" y="438">3</text>
  </g>
  <text x="692" y="63" font-size="12.5" font-weight="700" fill="#111">단계 <tspan font-weight="400" fill="#555">위에서 아래로 진행</tspan></text>

  <!-- what flows -->
  <g font-size="11.5" fill="#555">
    <text x="546" y="218" text-anchor="middle">벽 · 상자 · 바닥으로 나눈 화면, 최근 4장</text>
    <text x="333" y="160">지정 상자의 덩어리</text>
    <text x="648" y="96" text-anchor="middle">방위 · 거리</text>
    <text x="822" y="153">도착</text>
    <text x="822" y="391">집기 끝</text>
    <text x="760" y="18" text-anchor="middle">자기 명령 기록</text>
    <text x="820" y="538" text-anchor="middle">자기 명령 기록</text>
  </g>

  <!-- line legend -->
  <g fill="none" stroke="#111" stroke-width="1.15">
    <path d="M40 452 H92" marker-end="url(#h)"/>
    <path d="M40 476 H92" stroke-dasharray="7 4" marker-end="url(#h)"/>
    <path d="M40 500 H91" stroke-dasharray="0.1 4.2" stroke-width="1.9" stroke-linecap="round" marker-end="url(#o)"/>
  </g>
  <g font-size="11.5" fill="#555">
    <text x="102" y="456">신호 흐름</text>
    <text x="102" y="480">되먹임 (자기 명령 기록)</text>
    <text x="102" y="504">다음 단계로 넘어감</text>
  </g>
</svg>
